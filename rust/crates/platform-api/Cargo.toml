[package]
name = "platform-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync", "macros", "rt", "time"] }
tokio-stream = "0.1"
futures-core = "0.3"
getrandom = "0.2"
tower = "0.5"
durak-engine = { path = "../durak-engine" }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
