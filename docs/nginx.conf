# Include inside nginx's http block. Replace hostname, certificate paths and root.
# TLS termination is required for production. The backend must not be public.
server {
    listen 443 ssl;
    server_name durak.example.com;
    ssl_certificate /etc/ssl/durak/fullchain.pem;
    ssl_certificate_key /etc/ssl/durak/privkey.pem;

    root /srv/durak/web;
    disable_symlinks on;
    # URLs can contain session tokens, invitation codes or OAuth parameters.
    access_log off;

    location = / {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }
    location = /index.html {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /admin {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /admin.html =404;
    }
    location = /admin.html {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /app.js {
        types { application/javascript js; }
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location = /style.css {
        types { text/css css; }
        default_type text/css;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /css/style.css =404;
    }
    location ~ ^/js/.+\.js$ {
        types { application/javascript js; }
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~ ^/css/.+\.css$ {
        types { text/css css; }
        default_type text/css;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location = /events {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }
    location = /api/watch {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_cache off;
    }
    location = /readyz {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_cache off;
    }
    location / { return 404; }
}
